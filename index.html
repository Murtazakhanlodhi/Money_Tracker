<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MK Tracker">
<meta name="theme-color" content="#07090d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>MK Tracker · Money &amp; Tasks</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
/* =========================================================
   MK Tracker — premium fintech dashboard (dark)
   ========================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0A0B0F; --bg2:#0C0D12; --card:#13151C; --card2:#171A22; --raise:#1E222C;
  --line:rgba(255,255,255,.055); --line-2:rgba(255,255,255,.035); --hair:rgba(255,255,255,.10);
  --text:#F6F7FA; --mut:#8A91A3; --faint:#5B6072;
  --gold:#F5B843; --gold-2:#E0982D; --gold-soft:rgba(245,184,67,.14); --gold-line:rgba(245,184,67,.30);
  --in:#2ED47A; --in-soft:rgba(46,212,122,.13); --in-line:rgba(46,212,122,.28);
  --out:#FB5468; --out-soft:rgba(251,84,104,.13); --out-line:rgba(251,84,104,.28);
  --save:#8B7CF6; --save-soft:rgba(139,124,246,.15); --save-line:rgba(139,124,246,.30);
  --info:#3B82F6; --cyan:#22D3EE; --violet:#A855F7; --orange:#FB923C;
  --sh-sm:0 1px 2px rgba(0,0,0,.4),0 4px 14px -8px rgba(0,0,0,.6);
  --sh-md:0 12px 34px -14px rgba(0,0,0,.7),0 3px 10px -4px rgba(0,0,0,.5);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:
  radial-gradient(1200px 600px at 78% -8%,rgba(139,124,246,.10),transparent 60%),
  radial-gradient(900px 500px at 0% 100%,rgba(245,184,67,.06),transparent 55%),
  var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
h1,h2,h3,h4{font-family:'Sora','Inter',sans-serif;margin:0;letter-spacing:-.5px;color:var(--text);}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.mut{color:var(--mut);} .faint{color:var(--faint);}
.in-text{color:var(--in)!important;} .out-text{color:var(--out)!important;} .save-text{color:var(--save)!important;} .gold-text{color:var(--gold)!important;}
::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:#22262f;border-radius:20px;border:2px solid var(--bg);} ::-webkit-scrollbar-track{background:transparent;}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 16px;
  background:linear-gradient(180deg,#0C0E14,#0A0B10);border-right:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 16px;}
.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:'Sora';font-weight:800;font-size:16px;color:#241700;
  background:linear-gradient(135deg,#F7C65A,#E0982D);box-shadow:0 8px 20px -6px rgba(245,184,67,.55),inset 0 1px 0 rgba(255,255,255,.4);letter-spacing:-.5px;}
.brand-name{font-family:'Sora';font-weight:700;font-size:16px;color:#fff;letter-spacing:-.3px;}
.brand-sub{font-size:11.5px;color:var(--faint);margin-top:1px;}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px;flex:1;overflow-y:auto;}
.nav-cap{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px;}
.navitem{display:flex;align-items:center;gap:13px;padding:11px 12px;border:0;background:transparent;color:var(--mut);border-radius:12px;
  font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;font-family:inherit;position:relative;transition:background .16s,color .16s,transform .05s;}
.navitem svg{width:19px;height:19px;opacity:.85;transition:.16s;flex-shrink:0;}
.navitem:hover{background:rgba(255,255,255,.045);color:var(--text);}
.navitem:active{transform:scale(.98);}
.navitem.on{background:linear-gradient(90deg,rgba(245,184,67,.15),rgba(245,184,67,.02));color:#fff;box-shadow:inset 0 0 0 1px rgba(245,184,67,.20);}
.navitem.on::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#F7C65A,#E0982D);}
.navitem.on svg{color:var(--gold);opacity:1;}
.navitem .lbl2{display:none;}
.profile{display:flex;align-items:center;gap:11px;padding:11px 10px;margin-top:8px;border-radius:14px;background:var(--card);border:1px solid var(--line);}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:'Sora';font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#8B7CF6,#6D5CE0);flex-shrink:0;}
.profile .pn{font-size:13px;font-weight:600;color:#fff;line-height:1.2;}
.profile .pe{font-size:11px;color:var(--faint);}

/* ---------- content + topbar ---------- */
.content{display:flex;flex-direction:column;min-width:0;height:100vh;}
.topbar{display:flex;align-items:center;gap:18px;padding:20px 30px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(10,11,15,.92),rgba(10,11,15,.72));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2);}
.greet{flex:1;min-width:0;}
.greet h1{font-size:23px;font-weight:700;display:flex;align-items:center;gap:9px;}
.greet p{margin:3px 0 0;font-size:13px;color:var(--mut);}
.topsearch{position:relative;width:min(320px,34vw);}
.topsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px;}
.topsearch input{width:100%;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);color:var(--text);
  border-radius:13px;padding:12px 14px 12px 40px;font-family:inherit;font-size:13.5px;min-height:46px;transition:.15s;}
.topsearch input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--gold-line);}
.topsearch input::placeholder{color:var(--faint);}
.iconbtn{border:0;background:var(--card);color:var(--mut);cursor:pointer;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--line);transition:.15s;position:relative;flex-shrink:0;}
.iconbtn:hover{background:var(--raise);color:var(--text);}
.iconbtn.danger:hover{color:var(--out);background:var(--out-soft);box-shadow:inset 0 0 0 1px var(--out-line);}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:20px;background:var(--out);color:#fff;
  font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);font-family:'Inter';}

.main{flex:1;overflow-y:auto;padding:26px 30px 46px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.pagehead h1{font-size:22px;font-weight:700;}
.pagehead p{margin:5px 0 0;font-size:13px;color:var(--mut);max-width:60ch;}
.pagehead-actions{display:flex;gap:11px;align-items:center;flex-wrap:wrap;}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:13px;padding:12px 18px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s,box-shadow .2s,background .2s;min-height:46px;letter-spacing:-.1px;}
.btn:active{transform:translateY(1px) scale(.99);}
.btn.primary{background:linear-gradient(135deg,#F7C65A,#E0982D);color:#241700;box-shadow:0 10px 24px -10px rgba(245,184,67,.6),inset 0 1px 0 rgba(255,255,255,.35);}
.btn.primary:hover{filter:brightness(1.05);}
.btn.primary svg{stroke-width:2.6;}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.btn.ghost:hover{background:var(--raise);box-shadow:inset 0 0 0 1px var(--hair);}
.btn.sm{padding:9px 13px;min-height:38px;font-size:12.5px;border-radius:11px;}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:18px;overflow:hidden;}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 4px;}
.card-head h2{font-size:15px;font-weight:600;letter-spacing:-.2px;}
.card-body{padding:16px 20px 20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.linkish{font-size:12px;color:var(--gold);font-weight:600;cursor:pointer;background:transparent;border:0;font-family:inherit;}
.linkish:hover{text-decoration:underline;}

/* ---------- dashboard grid ---------- */
.dash-hero{display:grid;grid-template-columns:1.05fr 1.35fr;gap:18px;margin-bottom:18px;}
.kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px;}
.dash-mid{display:grid;grid-template-columns:1.3fr 1fr 1.1fr;gap:18px;margin-bottom:18px;}
.dash-low{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}

/* hero balance */
.hero{position:relative;border-radius:var(--r-lg);padding:24px;overflow:hidden;color:#fff;
  background:
   radial-gradient(120% 120% at 85% -10%,rgba(255,255,255,.14),transparent 45%),
   radial-gradient(90% 120% at 10% 110%,rgba(139,124,246,.5),transparent 55%),
   linear-gradient(135deg,#4A3C8F 0%,#332B6B 48%,#211E4A 100%);
  box-shadow:var(--sh-md),0 0 0 1px rgba(255,255,255,.05) inset;}
.hero::after{content:"";position:absolute;inset:0;background-image:
   radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.5),transparent),
   radial-gradient(1.5px 1.5px at 70% 20%,rgba(255,255,255,.35),transparent),
   radial-gradient(1.5px 1.5px at 85% 60%,rgba(255,255,255,.3),transparent),
   radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.3),transparent),
   radial-gradient(1.5px 1.5px at 55% 45%,rgba(255,255,255,.25),transparent);
  opacity:.7;pointer-events:none;}
.hero .h-top{display:flex;align-items:center;gap:9px;position:relative;z-index:1;}
.hero .h-top span{font-size:13px;color:rgba(255,255,255,.72);font-weight:500;}
.hero .eye{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;}
.hero .h-val{font-family:'Sora';font-weight:800;font-size:38px;letter-spacing:-1.6px;margin:12px 0 8px;position:relative;z-index:1;}
.hero .h-delta{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#fff;
  background:rgba(46,212,122,.2);padding:5px 10px;border-radius:20px;}
.hero .h-delta.down{background:rgba(251,84,104,.22);}
.hero .h-sub{position:relative;z-index:1;color:rgba(255,255,255,.6);font-size:12px;margin-left:9px;}
.hero-actions{display:flex;gap:10px;margin-top:20px;position:relative;z-index:1;flex-wrap:wrap;}
.hero-actions .hb{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;
  padding:10px 15px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
.hero-actions .hb:hover{background:rgba(255,255,255,.18);}
.hero-actions .hb.gold{background:linear-gradient(135deg,#F7C65A,#E0982D);color:#241700;border-color:transparent;box-shadow:0 8px 18px -8px rgba(245,184,67,.6);}

/* trend card */
.trend{padding:20px 22px 14px;}
.trend .t-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.trend h2{font-size:15px;font-weight:600;}
.trend .t-pick{font-size:12px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;}
.trend .chartwrap{position:relative;width:100%;}
.axislbl{font-size:10px;fill:var(--faint);font-family:'Inter';}
.gridline{stroke:rgba(255,255,255,.05);stroke-width:1;}

/* kpi */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 8px;box-shadow:var(--sh-sm);transition:transform .18s,box-shadow .18s;overflow:hidden;position:relative;}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md);}
.kpi .k-top{display:flex;align-items:center;gap:11px;}
.k-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;}
.k-icon svg{width:19px;height:19px;}
.kpi .k-name{font-size:12.5px;color:var(--mut);font-weight:500;}
.kpi .k-val{font-family:'Sora';font-weight:700;font-size:22px;letter-spacing:-.8px;margin-top:9px;}
.kpi .k-delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;margin-top:5px;}
.kpi .k-delta.up{color:var(--in);} .kpi .k-delta.down{color:var(--out);} .kpi .k-delta.flat{color:var(--faint);}
.kpi .spark{display:block;margin:8px -16px -8px;width:calc(100% + 32px);}

/* donut + legend */
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.donut-cap{fill:var(--faint);font-size:11px;font-family:'Inter';font-weight:500;}
.donut-val{fill:#fff;font-size:17px;font-family:'Sora';font-weight:700;}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:11px;}
.legrow{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.legdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legrow .ln{color:var(--text);flex:1;}
.legrow .la{font-family:'JetBrains Mono';font-weight:600;color:var(--text);}
.legrow .lp{color:var(--faint);width:44px;text-align:right;font-size:11.5px;}

/* health */
.healthwrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.ring-val{fill:#fff;font-size:26px;font-family:'Sora';font-weight:800;}
.ring-cap{fill:var(--in);font-size:11px;font-family:'Inter';font-weight:600;}
.hbars{width:100%;display:flex;flex-direction:column;gap:12px;}
.hbar{display:grid;grid-template-columns:74px 1fr 38px;align-items:center;gap:11px;font-size:12px;}
.hbar .hl{color:var(--mut);display:flex;align-items:center;gap:7px;}
.hbar .hl i{width:8px;height:8px;border-radius:3px;display:inline-block;}
.hbar .htrack{height:7px;border-radius:20px;background:rgba(255,255,255,.06);overflow:hidden;}
.hbar .hfill{height:100%;border-radius:20px;}
.hbar .hp{text-align:right;color:var(--text);font-weight:600;font-family:'JetBrains Mono';font-size:11.5px;}

/* goals list */
.goalrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-2);}
.goalrow:last-child{border-bottom:0;}
.g-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;}
.g-ic svg{width:20px;height:20px;}
.goalrow .gm{flex:1;min-width:0;}
.goalrow .gt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.goalrow .gn{font-size:13.5px;font-weight:600;color:#fff;}
.goalrow .gp{font-size:13px;font-weight:700;font-family:'Sora';}
.goalrow .gsub{font-size:11px;color:var(--faint);margin-top:2px;font-family:'JetBrains Mono';}
.gtrack{height:6px;border-radius:20px;background:rgba(255,255,255,.06);margin-top:8px;overflow:hidden;}
.gfill{height:100%;border-radius:20px;}
.gdays{font-size:11px;color:var(--faint);white-space:nowrap;}

/* recent tx rows */
.txrow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line-2);}
.txrow:last-child{border-bottom:0;}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:'Sora';font-weight:700;font-size:16px;flex-shrink:0;}
.txrow .txm{flex:1;min-width:0;}
.txrow .txn{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txrow .txs{font-size:11.5px;color:var(--faint);margin-top:2px;}
.txrow .txr{text-align:right;flex-shrink:0;}
.txrow .txa{font-family:'JetBrains Mono';font-weight:700;font-size:13.5px;}
.txrow .txd{font-size:11px;color:var(--faint);margin-top:2px;}

/* task mini */
.tmini{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);}
.tmini:last-child{border-bottom:0;}
.tmini .tmn{flex:1;font-size:13.5px;color:var(--text);font-weight:500;}
.tmini .tmn.done{text-decoration:line-through;color:var(--faint);}
.tmini .tmd{font-size:12px;font-weight:600;font-family:'JetBrains Mono';}

/* check */
.check{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--hair);background:var(--card2);cursor:pointer;flex-shrink:0;
  display:grid;place-items:center;color:#04140d;transition:.16s;border:0;}
.check:hover{box-shadow:inset 0 0 0 2px var(--in);}
.check.on{background:var(--in);box-shadow:0 0 12px -2px var(--in-line),inset 0 0 0 2px var(--in);}
.check.on svg{stroke-width:3;}

/* ---------- generic stats / rows / tables (other pages) ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh-sm);}
.stat-label{font-size:12px;color:var(--mut);font-weight:500;}
.stat-value{font-family:'Sora';font-weight:700;font-size:23px;letter-spacing:-.8px;margin:9px 0 4px;}
.stat-sub{font-size:11px;color:var(--faint);}
.stat.in .stat-value{color:var(--in);} .stat.out .stat-value{color:var(--out);} .stat.save .stat-value{color:var(--save);} .stat.gold .stat-value{color:var(--gold);}
.ministat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center;box-shadow:var(--sh-sm);transition:transform .18s;}
.ministat:hover{transform:translateY(-3px);}
.ministat b{font-family:'Sora';font-size:28px;display:block;line-height:1;letter-spacing:-1px;}
.ministat span{font-size:11.5px;color:var(--mut);font-weight:600;display:block;margin-top:9px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:13px;}
.row:last-child{border-bottom:0;} .row.total{border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:13px;font-weight:600;}
.row span{color:var(--mut);} .row b{color:var(--text);}
.bigstat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh-sm);}
.bigstat span{font-size:12.5px;color:var(--mut);display:block;} .bigstat b{font-family:'Sora';font-size:26px;display:block;margin-top:8px;letter-spacing:-.8px;}
.bigstat.in b{color:var(--in);} .bigstat.out b{color:var(--out);} .bigstat.save b{color:var(--save);} .bigstat.wide{margin-bottom:18px;}
.budget-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr .7fr;gap:10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);padding-bottom:10px;border-bottom:1px solid var(--line);font-weight:700;}
.budget-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr .7fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;}
.budget-row:last-child{border-bottom:0;}
.budget-cat span{display:block;margin-bottom:7px;color:var(--text);}
.bar{height:6px;border-radius:20px;background:rgba(255,255,255,.06);overflow:hidden;}
.bar-fill{height:100%;border-radius:20px;background:var(--in);transition:width .5s;}
.bar-fill.ok{background:var(--in);} .bar-fill.near{background:var(--gold);} .bar-fill.over{background:var(--out);} .bar-fill.none{background:#2a2f3a;} .bar-fill.gold{background:linear-gradient(90deg,#F7C65A,#E0982D);}
.tbl{width:100%;}
.th{display:grid;grid-template-columns:96px 110px 1fr 2fr 110px 120px 44px;gap:10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);padding-bottom:11px;border-bottom:1px solid var(--line);font-weight:700;}

.note{color:var(--faint);font-style:normal;font-size:11.5px;}
.goalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.goalcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh-sm);}
.goalcard-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;}
.goalcard-top h3{font-size:15px;font-weight:600;} .goalcard-top .mut{font-size:11.5px;}
.goalbar{height:8px;border-radius:20px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:12px;}
.goalbar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#F7C65A,#E0982D);}
.goalnums{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;} .goalnums b{font-family:'Sora';font-size:19px;} .goalnums .mut{font-size:12px;}
.goalfoot{display:flex;justify-content:space-between;font-size:12px;padding-top:12px;border-top:1px solid var(--line-2);}
.inline-edit{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--mut);}
.inline-edit input{width:120px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:9px 11px;font-family:'JetBrains Mono';font-size:13px;}
.why{margin:12px 0 0;font-size:12px;color:var(--faint);line-height:1.6;}
.goal-mini{margin-bottom:14px;} .goal-mini:last-child{margin-bottom:0;}
.goal-mini-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;} .goal-mini-top b{font-family:'JetBrains Mono';} .goal-mini-top em{color:var(--faint);font-style:normal;}

/* ---------- chips ---------- */
.chip{display:inline-block;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,.06);color:var(--mut);letter-spacing:-.1px;white-space:nowrap;}
.chip.in{background:var(--in-soft);color:var(--in);box-shadow:inset 0 0 0 1px var(--in-line);}
.chip.out{background:var(--out-soft);color:var(--out);box-shadow:inset 0 0 0 1px var(--out-line);}
.chip.save{background:var(--save-soft);color:var(--save);box-shadow:inset 0 0 0 1px var(--save-line);}
.chip.gold{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line);}
.chip.due-today{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line);}
.chip.due-soon{background:rgba(59,130,246,.15);color:#7FB0FF;box-shadow:inset 0 0 0 1px rgba(59,130,246,.3);}
.chip.due-over{background:var(--out-soft);color:var(--out);box-shadow:inset 0 0 0 1px var(--out-line);}
.chip.due-none{background:rgba(255,255,255,.05);color:var(--mut);}
.chip.rep{background:rgba(168,85,247,.16);color:#C4B5FD;}
.chip.rem{background:rgba(255,255,255,.05);color:var(--mut);}

/* ---------- tasks ---------- */
.tfilter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
.tfilter .tsearch{flex:1;min-width:180px;}
.tfilter input,.tfilter select{border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:11px 13px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;min-height:44px;}
.tfilter .tsearch input{width:100%;}
.tfilter select option{background:#14161f;color:var(--text);}
.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1px var(--line);}
.segbtn{border:0;background:transparent;color:var(--mut);padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;min-height:38px;}
.segbtn.on{background:var(--gold-soft);color:var(--gold);}
.taskcard{display:flex;align-items:flex-start;gap:13px;padding:14px;border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:14px;margin-bottom:10px;background:var(--card);transition:box-shadow .15s;}
.taskcard:hover{box-shadow:var(--sh-sm);}
.taskcard.done{opacity:.55;}
.taskcard .grow{flex:1;min-width:0;}
.taskcard .tt{font-weight:600;font-size:14.5px;color:#fff;word-break:break-word;}
.taskcard .tt.done{text-decoration:line-through;color:var(--mut);}
.taskcard .check{margin-top:1px;}
.tchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.tnote{color:var(--mut);font-size:12.5px;margin-top:7px;line-height:1.5;}
.tacts{display:flex;gap:2px;flex-shrink:0;}
.tacts .iconbtn{width:34px;height:34px;border-radius:9px;box-shadow:none;background:transparent;}
.tacts .iconbtn:hover{background:rgba(255,255,255,.05);}
.grouplbl{display:flex;align-items:center;gap:9px;margin:20px 2px 12px;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);}
.grouplbl span{font-family:'JetBrains Mono';color:var(--faint);}
.grouplbl.over{color:var(--out);} .grouplbl.today{color:var(--gold);} .grouplbl.soon{color:#7FB0FF;}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line-2);}
.setrow:last-child{border-bottom:0;}
.setrow h4{font-size:14px;font-weight:600;margin:0 0 3px;font-family:'Inter';}
.setright{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.pill{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;white-space:nowrap;}
.pill.ok{background:var(--in-soft);color:var(--in);} .pill.no{background:var(--out-soft);color:var(--out);}
.toggle{width:48px;height:27px;border-radius:20px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--hair);position:relative;border:0;cursor:pointer;transition:.18s;flex-shrink:0;}
.toggle::after{content:"";position:absolute;top:2.5px;left:2.5px;width:21px;height:21px;border-radius:50%;background:var(--mut);transition:.18s;}
.toggle.on{background:var(--in-soft);box-shadow:inset 0 0 0 1px var(--in-line);}
.toggle.on::after{left:23px;background:var(--in);}
.budget-input{width:120px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:9px 11px;font-family:'JetBrains Mono';font-size:13px;text-align:right;}

.datarow{display:flex;gap:11px;flex-wrap:wrap;margin-top:14px;align-items:center;}
.empty{padding:38px 0;text-align:center;color:var(--faint);font-size:13.5px;}

/* ---------- cycle select ---------- */
.cycle{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:13px;padding:7px 8px 7px 15px;min-height:46px;}

.cycle select{border:0;background:var(--card2);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
.cycle select option{background:#14161f;color:var(--text);}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,5,9,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:80;animation:ov .2s ease;}
@keyframes ov{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:var(--sh-md);border:1px solid var(--hair);animation:mo .28s cubic-bezier(.2,.8,.25,1);}
@keyframes mo{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2;}

.modal-head .iconbtn{width:38px;height:38px;background:transparent;box-shadow:none;}
.modal-body{padding:20px 22px 22px;}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:15px;}
.field>span{font-size:12.5px;font-weight:600;color:var(--mut);}
.field input,.field select{border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:13px;padding:14px;font-family:inherit;font-size:16px;background:var(--card2);width:100%;color:var(--text);min-height:50px;transition:.15s;}
.field input:focus,.field select:focus{outline:none;box-shadow:inset 0 0 0 1px var(--gold-line);}
.field input::placeholder{color:var(--faint);}
.field select option{background:#14161f;color:var(--text);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.modal-foot{display:flex;justify-content:flex-end;gap:11px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}

/* ---------- responsive ---------- */

/* ---- computations ---- */
function totals(cyc){
  var c=cyc||state.selectedCycle;
  var tx=state.transactions.filter(function(t){return inCycle(t.date,c);});
  var sum=function(arr){return arr.reduce(function(s,t){return s+Number(t.amount||0);},0);};
  var moneyIn=sum(tx.filter(function(t){return t.type==="Income";}));
  var moneyOut=sum(tx.filter(function(t){return t.type==="Expense";}));
  var saved=sum(tx.filter(function(t){return t.type==="Saving/Investment";}));
  var income={Salary:0,Freelance:0,"Other Income":0};
  tx.filter(function(t){return t.type==="Income";}).forEach(function(t){income[t.category]=(income[t.category]||0)+Number(t.amount||0);});
  var spentByCat={};
  tx.filter(function(t){return t.type!=="Income";}).forEach(function(t){spentByCat[t.category]=(spentByCat[t.category]||0)+Number(t.amount||0);});
  var owedToMe=0,iOwe=0;
  state.debts.forEach(function(d){var sign=d.entry==="Repayment"?-1:1; if(d.dir==="They owe me")owedToMe+=sign*Number(d.amount||0); else iOwe+=sign*Number(d.amount||0);});
  var totalSaved=0,byDest={};
  state.savings.forEach(function(s){var sign=s.flow==="Money Out"?-1:1; totalSaved+=sign*Number(s.amount||0); byDest[s.where]=(byDest[s.where]||0)+sign*Number(s.amount||0);});
  return {moneyIn:moneyIn,moneyOut:moneyOut,saved:saved,cashLeft:moneyIn-moneyOut-saved,income:income,spentByCat:spentByCat,owedToMe:owedToMe,iOwe:iOwe,totalSaved:totalSaved,byDest:byDest};
}

function sparkline(vals,color,h){
  h=h||40;var w=140;if(!vals||!vals.length)vals=[0,0];if(vals.length===1)vals=[vals[0],vals[0]];
  var max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),rng=(max-min)||1,step=w/(vals.length-1);
  var pts=vals.map(function(v,i){return (i*step).toFixed(1)+" "+(h-3-((v-min)/rng)*(h-6)).toFixed(1);});
  var line="M"+pts.join(" L"),area=line+" L"+w+" "+h+" L0 "+h+" Z",id="s"+Math.random().toString(36).slice(2,7);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" height="'+h+'">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".3"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function areaChart(days,color){
  var W=580,H=210,padL=6,padR=6,padT=14,padB=26;
  var vals=[],cc=0;days.forEach(function(d){cc+=d.in-d.out-d.save;vals.push(cc);});
  if(vals.length<2)vals=[0].concat(vals.length?vals:[0]);
  var max=Math.max.apply(null,vals),min=Math.min.apply(null,vals);if(max===min){max+=1;min-=1;}
  var iw=W-padL-padR,ih=H-padT-padB,sx=iw/(vals.length-1);
  function X(i){return padL+i*sx;}function Y(v){return padT+ih-((v-min)/(max-min))*ih;}
  var line=vals.map(function(v,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);}).join(" ");
  var area=line+" L"+X(vals.length-1).toFixed(1)+" "+(padT+ih)+" L"+padL+" "+(padT+ih)+" Z";
  var grid="";for(var g=0;g<=3;g++){var yy=(padT+ih*g/3).toFixed(1);grid+='<line class="gridline" x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'"/>';}
  var n=vals.length,lab="",ticks=Math.min(5,n);
  for(var k=0;k<ticks;k++){var idx=Math.round(k*(n-1)/((ticks-1)||1)),dd=days[idx]?parseD(days[idx].iso):null,lb=dd?(pad(dd.getDate())+" "+MONTHS[dd.getMonth()]):"";lab+='<text class="axislbl" x="'+X(idx).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(k===0?"start":k===ticks-1?"end":"middle")+'">'+lb+'</text>';}
  var lx=X(vals.length-1).toFixed(1),ly=Y(vals[vals.length-1]).toFixed(1),id="a"+Math.random().toString(36).slice(2,6);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".32"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#'+id+')"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+lx+'" cy="'+ly+'" r="8" fill="'+color+'" opacity=".2"/><circle cx="'+lx+'" cy="'+ly+'" r="4.2" fill="'+color+'"/>'+lab+'</svg>';
}

  if(kind==="debt") state.debts.push({id:id,date:v("f_date"),person:v("f_person"),dir:v("f_dir"),entry:v("f_entry"),amount:Number(v("f_amount"))||0,note:v("f_note")});
  if(kind==="save") state.savings.push({id:id,date:v("f_date"),where:v("f_where"),kind:v("f_kind"),flow:v("f_flow"),amount:Number(v("f_amount"))||0,note:v("f_note")});
  if(kind==="goal") state.goals.push({id:id,goal:v("f_goal"),category:v("f_category"),priority:v("f_priority"),target:Number(v("f_target"))||0,saved:Number(v("f_saved"))||0,date:v("f_date"),why:v("f_why")});
  if(kind==="task"){ var ti=v("f_title").trim(); if(!ti){ closeModal(); return; }
    var data={title:ti,desc:v("f_desc").trim(),cat:v("f_cat"),pri:v("f_pri"),start:v("f_start"),due:v("f_due")?new Date(v("f_due")).toISOString():"",repeat:v("f_repeat"),remind:Number(v("f_remind"))};
    if(window._editTask){ for(var _j=0;_j<state.tasks.length;_j++){ if(state.tasks[_j].id===window._editTask){ for(var _p in data)state.tasks[_j][_p]=data[_p]; break; } } window._editTask=null; }
    else { data.id=id; data.status="todo"; data.created=Date.now(); state.tasks.push(data); }
  }
  if(kind==="cycle"){ var cs=v("f_cstart"),ce=v("f_cend"); if(!cs){ closeModal(); return; } if(!ce||ce<cs)ce=cs; state.customCycle={start:cs,end:ce,label:fmtDate(cs)+" – "+fmtDate(ce)}; state.selectedCycle="custom"; }
  save(); closeModal(); render();
}

/* ---- data backup ---- */
function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url; a.download="money-tracker-backup.json"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importData(){
  var inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){ var file=inp.files[0]; if(!file)return; var r=new FileReader();
    r.onload=function(){ try{ var d=JSON.parse(r.result); if(d&&d.transactions){ state=d; save(); render(); alert("Backup loaded."); } else alert("That file doesn't look like a Money Tracker backup."); }catch(e){ alert("Could not read that file."); } };
    r.readAsText(file); };
  inp.click();
}

/* ---- events (delegation, survives re-renders) ---- */
document.addEventListener("click",function(e){
  var el, t=e.target;
  /* close only when the dark backdrop itself is tapped, or a close/cancel/X button */
  if(t.getAttribute && t.getAttribute("data-overlay")!==null){ closeModal(); return; }
  if(t.closest && t.closest("[data-close]")){ closeModal(); return; }
  if(el=t.closest("[data-save]")){ saveModal(el.getAttribute("data-save")); return; }
  if(el=t.closest("[data-tab]")){ tab=el.getAttribute("data-tab"); render(); return; }
  if(el=t.closest("[data-add]")){ openModal(el.getAttribute("data-add")); return; }
  if(el=t.closest("[data-del]")){ var list=el.getAttribute("data-del"),id=el.getAttribute("data-id"); state[list]=state[list].filter(function(x){return x.id!==id;}); save(); render(); return; }
  if(el=t.closest("[data-toggle]")){ var tid=el.getAttribute("data-toggle"); state.tasks.forEach(function(k){if(k.id===tid)k.done=!k.done;}); save(); render(); return; }
  if(t.closest("[data-export]")){ exportData(); return; }
  if(t.closest("[data-import]")){ importData(); return; }
  if(t.closest("[data-reset]")){ if(confirm("Reset everything back to the sample data? This clears your changes.")){ state=makeSeed(); save(); render(); } return; }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.hasAttribute("data-cycle")){ var cv=el.value; if(cv==="__addcustom"){ openModal("cycle"); render(); return; } state.selectedCycle=cv; save(); render(); return; }
  if(el.hasAttribute("data-budget")){ state.budgets[el.getAttribute("data-budget")]=Number(el.value)||0; save(); render(); return; }
  if(el.hasAttribute("data-goalsaved")){ var gid=el.getAttribute("data-goalsaved"); state.goals.forEach(function(g){if(g.id===gid)g.saved=Number(el.value)||0;}); save(); render(); return; }
});


/* ================= TASKS + REMINDERS (combined) ================= */
var TCATS=["Office","Personal","Home","Health","Finance","Study","Other"];
var TCAT_COLOR={Office:"#8B90FF",Personal:"#34D399",Home:"#38BDF8",Health:"#FB7185",Finance:"#F5C46B",Study:"#A78BFA",Other:"#9AA4B8"};
var REMIND_OPTS=[["-1","No email reminder"],["0","At due time"],["15","15 min before"],["60","1 hour before"],["180","3 hours before"],["1440","1 day before"],["2880","2 days before"]];
function hexA(hex,a){ var m=hex.replace("#",""); return "rgba("+parseInt(m.substr(0,2),16)+","+parseInt(m.substr(2,2),16)+","+parseInt(m.substr(4,2),16)+","+a+")"; }
function catChip(c){ var col=TCAT_COLOR[c]||"#9AA4B8"; return '<span class="chip" style="background:'+hexA(col,0.15)+';color:'+col+'">'+esc(c)+'</span>'; }
function remindLabel(m){ m=Number(m); var f={"-1":"No reminder","0":"At due time","15":"15 min before","60":"1 hr before","180":"3 hr before","1440":"1 day before","2880":"2 days before"}; return f[m]!=null?f[m]:(m+" min before"); }
function remindSel(id,val){ return '<select id="'+id+'">'+REMIND_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===String(val)?' selected':'')+'>'+o[1]+'</option>';}).join("")+'</select>'; }
function toLocalInput(iso){ var d=new Date(iso),off=d.getTimezoneOffset(),l=new Date(d.getTime()-off*60000); return l.toISOString().slice(0,16); }
function defaultDue(){ var d=new Date(); d.setHours(18,0,0,0); return toLocalInput(d.toISOString()); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function isOverdueTask(k){ if(!k.due||k.status==="done")return false; return new Date(k.due).getTime()<Date.now(); }
function isDueTodayTask(k){ if(!k.due||k.status==="done")return false; return sameDay(new Date(k.due),new Date())&&!isOverdueTask(k); }
function cmpDue(a,b){ var da=a.due?new Date(a.due):null,db=b.due?new Date(b.due):null; if(!da&&!db)return 0; if(!da)return 1; if(!db)return -1; return da-db; }
function relDueTask(t){
  if(!t.due) return {txt:"No due date",cls:"none"};
  var d=new Date(t.due),now=new Date();
  var dayDiff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  var time=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  if(t.status==="done") return {txt:d.toLocaleDateString([], {day:"numeric",month:"short"}),cls:"none"};
  if(d.getTime()<now.getTime()){ var days=Math.abs(dayDiff); return {txt:days===0?"Overdue \u00b7 "+time:days+"d overdue",cls:"over"}; }
  if(dayDiff===0) return {txt:"Today \u00b7 "+time,cls:"today"};
  if(dayDiff===1) return {txt:"Tomorrow \u00b7 "+time,cls:"soon"};
  if(dayDiff<=6) return {txt:d.toLocaleDateString([], {weekday:"short"})+" \u00b7 "+time,cls:"soon"};
  return {txt:d.toLocaleDateString([], {day:"numeric",month:"short"}),cls:"none"};
}
function taskChips(t){
  var r=relDueTask(t), h=catChip(t.cat);
  h+=chip(t.pri==="High"?"out":t.pri==="Medium"?"gold":"in",t.pri);
  h+='<span class="chip due-'+r.cls+'">'+esc(r.txt)+'</span>';
  if(t.repeat&&t.repeat!=="none") h+='<span class="chip rep">\u21bb '+esc(t.repeat)+'</span>';
  if(Number(t.remind)>=0) h+='<span class="chip rem">\ud83d\udd14 '+remindLabel(t.remind)+'</span>';
  return h;
}
function taskRow(k){
  var done=k.status==="done";
  var spine=k.pri==="High"?"#FB7185":k.pri==="Medium"?"#F5C46B":"#34D399";
  return '<div class="taskcard'+(done?' done':'')+'" style="border-left-color:'+spine+'">'+
    '<button class="check'+(done?' on':'')+'" data-tasktoggle="'+k.id+'">'+(done?svg("task",13):'')+'</button>'+
    '<div class="grow"><div class="tt'+(done?' done':'')+'">'+esc(k.title||"")+'</div><div class="tchips">'+taskChips(k)+'</div>'+
    (k.desc?'<div class="tnote">'+esc(k.desc)+'</div>':'')+'</div>'+
    '<div class="tacts"><button class="iconbtn" data-edittask="'+k.id+'" aria-label="Edit">'+svg("edit",15)+'</button>'+delBtn("tasks",k.id)+'</div></div>';
}
function taskFiltered(){
  var f=state.taskFilter||{};
  var arr=state.tasks.filter(function(k){
    if(f.status==="active"&&k.status==="done")return false;
    if(f.status==="done"&&k.status!=="done")return false;
    if(f.cat&&k.cat!==f.cat)return false;
    if(f.pri&&k.pri!==f.pri)return false;
    if(f.q){var q=f.q.toLowerCase(); if((k.title||"").toLowerCase().indexOf(q)<0&&(k.desc||"").toLowerCase().indexOf(q)<0)return false;}
    if(state.q){var gq=state.q.toLowerCase(); if((k.title||"").toLowerCase().indexOf(gq)<0&&(k.desc||"").toLowerCase().indexOf(gq)<0&&(k.cat||"").toLowerCase().indexOf(gq)<0)return false;}
    return true;
  });
  var s=f.sort||"due";
  arr.sort(function(a,b){
    if(s==="pri"){var o={High:0,Medium:1,Low:2}; return o[a.pri]-o[b.pri]||cmpDue(a,b);}
    if(s==="created")return (b.created||0)-(a.created||0);
    if(s==="title")return (a.title||"").localeCompare(b.title||"");
    return cmpDue(a,b);
  });
  return arr;
}
function taskRowsHTML(){ var a=taskFiltered(); return a.length?a.map(taskRow).join(""):'<div class="empty">No tasks match. Try changing the filters, or add a task.</div>'; }
function nextDate(d,rep){ var x=new Date(d); if(rep==="daily")x.setDate(x.getDate()+1); else if(rep==="weekly")x.setDate(x.getDate()+7); else if(rep==="monthly")x.setMonth(x.getMonth()+1); return x; }
function toggleTaskDone(id){
  var k=null; for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i].id===id){k=state.tasks[i];break;} } if(!k)return;
  if(k.status==="done"){ k.status="todo"; k.completedAt=null; }
  else{
    k.status="done"; k.completedAt=Date.now();
    if(k.repeat&&k.repeat!=="none"&&k.due){
      var nd=nextDate(new Date(k.due),k.repeat), ns=k.start?nextDate(parseD(k.start),k.repeat):null;
      state.tasks.push({id:uid(),title:k.title,desc:k.desc,cat:k.cat,pri:k.pri,repeat:k.repeat,remind:k.remind,start:ns?toISO(ns):"",due:nd.toISOString(),status:"todo",created:Date.now()});
    }
  }
  save(); render();
}
/* ---- settings cards ---- */
function reminderCardHTML(){
  var perm=("Notification" in window)?Notification.permission:"unsupported";
  var on=state.notif&&perm==="granted";
  var txt=on?"On":perm==="denied"?"Blocked":perm==="unsupported"?"Not supported":"Off";
  return '<div class="setrow"><div><h4>Browser notifications</h4><p class="about">Pop-up alert when a task is due \u2014 works while this app is open in a tab.</p></div>'+
    '<div class="setright"><span class="pill '+(on?"ok":"no")+'">'+txt+'</span><button class="toggle'+(on?" on":"")+'" data-notiftoggle aria-label="Toggle notifications"></button></div></div>'+
    '<div class="setrow"><div><h4>Test it</h4><p class="about">Send a sample notification right now.</p></div><button class="btn ghost" data-testnotif>Send test</button></div>';
}
function emailCardHTML(){
  var e=state.email||{}, ready=e.to&&e.service&&e.template&&e.key;
  return '<p class="about"><b>Read me:</b> a GitHub Pages site can\'t email on its own. Connect a free EmailJS account (service + template) and paste the 3 IDs. Each task\'s reminder timing is chosen when you add or edit it.</p>'+
    '<label class="field"><span>Send reminders to (your email)</span><input id="s_emto" value="'+esc(e.to||"")+'" placeholder="you@example.com"></label>'+
    '<div class="two"><label class="field"><span>Service ID</span><input id="s_emservice" value="'+esc(e.service||"")+'"></label>'+
    '<label class="field"><span>Template ID</span><input id="s_emtemplate" value="'+esc(e.template||"")+'"></label></div>'+
    '<label class="field"><span>Public key</span><input id="s_emkey" value="'+esc(e.key||"")+'"></label>'+
    '<div class="datarow"><button class="btn primary" data-savemail>Save email settings</button><button class="btn ghost" data-testmail>Send test email</button><span class="pill '+(ready?"ok":"no")+'" style="align-self:center">'+(ready?"Ready":"Not set up")+'</span></div>'+
    '<p class="about" style="font-size:11px;">Template variables: to_email, task_title, due_text, message. These IDs stay only in your browser.</p>';
}
/* ---- notifications + email ---- */
function fireNotif(title,body){ try{ new Notification(title,{body:body}); }catch(e){} }
function toggleNotif(){
  if(!("Notification" in window)){ alert("This browser has no notification support."); return; }
  if(state.notif){ state.notif=false; save(); render(); return; }
  if(Notification.permission==="granted"){ state.notif=true; save(); render(); checkReminders(); return; }
  Notification.requestPermission().then(function(p){ state.notif=(p==="granted"); save(); render(); if(p==="granted")checkReminders(); });
}
function testNotif(){ if(!("Notification" in window)||Notification.permission!=="granted"){ alert("Turn on browser notifications first."); return; } fireNotif("MK Tracker","This is how your reminders will look \u2705"); }
function emailReady(){ var e=state.email||{}; return e.to&&e.service&&e.template&&e.key; }
function saveEmailFromInputs(){ state.email={to:(v("s_emto")||"").trim(),service:(v("s_emservice")||"").trim(),template:(v("s_emtemplate")||"").trim(),key:(v("s_emkey")||"").trim()}; save(); }
function sendEmail(params){ var e=state.email||{}; return fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:e.service,template_id:e.template,user_id:e.key,template_params:params})}); }
function testEmail(){
  saveEmailFromInputs();
  if(!emailReady()){ alert("Fill in all email fields first."); render(); return; }
  sendEmail({to_email:state.email.to,task_title:"Test reminder",due_text:"right now",message:"Your MK Tracker email reminders are working \ud83c\udf89"})
    .then(function(r){ alert(r.ok?"Test email sent \u2014 check your inbox.":"Email failed \u2014 double-check your EmailJS IDs."); render(); })
    .catch(function(){ alert("Email failed \u2014 check your EmailJS IDs / network."); });
}
function checkReminders(){
  if(!state.notif&&!emailReady())return;
  var now=Date.now(); state.notified=state.notified||{}; var changed=false;
  state.tasks.forEach(function(k){
    if(k.status==="done"||!k.due)return;
    var rem=Number(k.remind); if(isNaN(rem)||rem<0)return;
    var fireAt=new Date(k.due).getTime()-rem*60000;
    if(now>=fireAt){
      var key=k.id+"|"+k.due+"|"+k.remind;
      if(!state.notified[key]){
        state.notified[key]=now; changed=true;
        var r=relDueTask(k);
        if(state.notif&&("Notification" in window)&&Notification.permission==="granted") fireNotif("\u23f0 "+k.title,(r.cls==="over"?"Overdue":"Due")+" \u2014 "+r.txt+" \u00b7 "+k.cat);
        if(emailReady()) sendEmail({to_email:state.email.to,task_title:k.title,due_text:r.txt,message:'Reminder: "'+k.title+'" is '+(r.cls==="over"?"overdue":"due")+" ("+r.txt+"). Category: "+k.cat+", Priority: "+k.pri+"."}).catch(function(){});
      }
    }
  });
  if(changed)save();
}
setInterval(checkReminders,60000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden)checkReminders(); });
/* ---- extra events for task + reminder UI ---- */
document.addEventListener("click",function(e){
  var t=e.target, el;
  if(el=t.closest("[data-tasktoggle]")){ toggleTaskDone(el.getAttribute("data-tasktoggle")); return; }
  if(el=t.closest("[data-edittask]")){ window._editTask=el.getAttribute("data-edittask"); openModal("task"); return; }
  if(el=t.closest("[data-taskstatus]")){ state.taskFilter.status=el.getAttribute("data-taskstatus"); save(); render(); return; }
  if(t.closest("[data-notiftoggle]")){ toggleNotif(); return; }
  if(t.closest("[data-testnotif]")){ testNotif(); return; }
  if(t.closest("[data-savemail]")){ saveEmailFromInputs(); render(); return; }
  if(t.closest("[data-testmail]")){ testEmail(); return; }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.hasAttribute&&el.hasAttribute("data-taskfilter")){ state.taskFilter[el.getAttribute("data-taskfilter")]=el.value; save(); render(); }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="taskSearch"){ state.taskFilter.q=el.value; var box=document.getElementById("taskListBody"); if(box)box.innerHTML=taskRowsHTML(); }
});

/* ---- topbar / dashboard nav events ---- */
document.addEventListener("click",function(e){
  var t=e.target, el;
  if(el=t.closest("[data-gonav]")){ tab=el.getAttribute("data-gonav"); render(); return; }
  if(el=t.closest("[data-eye]")){ state.hideBalance=!state.hideBalance; save(); render(); return; }
});
document.addEventListener("input",function(e){
  if(e.target && e.target.id==="topSearch"){ state.q=e.target.value; window._refocus="topSearch"; render(); }
});

render();
checkReminders();
</script>
