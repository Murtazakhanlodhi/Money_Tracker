<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MK Tracker">
<meta name="theme-color" content="#07090D">
<meta name="format-detection" content="telephone=no">
<title>MK Tracker · Money &amp; Tasks</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
/* ===================================================================
   MK Tracker — mobile-first (Money & Tasks)
   =================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root{
  --bg:#07090D; --bg2:#0B0E14; --card:#0F1219; --card2:#141824; --raise:#1B2130;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.04); --hair:rgba(255,255,255,.09);
  --text:#F4F6FB; --mut:#9AA1B2; --faint:#626A7D;
  --pri:#7C5CFF; --pri2:#A855F7; --pri-soft:rgba(124,92,255,.16); --pri-line:rgba(124,92,255,.34);
  --in:#2ED47A; --in-soft:rgba(46,212,122,.14); --in-line:rgba(46,212,122,.30);
  --out:#FB5468; --out-soft:rgba(251,84,104,.14); --out-line:rgba(251,84,104,.30);
  --blue:#3B82F6; --blue-soft:rgba(59,130,246,.16); --blue-line:rgba(59,130,246,.30);
  --amber:#F5B843; --amber-soft:rgba(245,184,67,.16); --amber-line:rgba(245,184,67,.30);
  --cyan:#22D3EE; --violet:#A855F7;
  --grad:linear-gradient(135deg,#7C5CFF,#A855F7);
  --sh:0 10px 30px -14px rgba(0,0,0,.7),0 2px 8px -3px rgba(0,0,0,.5);
}
html,body{height:100%;}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);
  background:radial-gradient(120% 90% at 80% -10%,rgba(124,92,255,.12),transparent 55%),
            radial-gradient(90% 70% at 0% 100%,rgba(168,85,247,.07),transparent 55%),var(--bg);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
h1,h2,h3,h4{font-family:'Sora','Inter',sans-serif;letter-spacing:-.4px;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}
.in-text{color:var(--in);} .out-text{color:var(--out);} .pri-text{color:var(--pri2);} .blue-text{color:var(--blue);} .amber-text{color:var(--amber);}
.mut{color:var(--mut);} .faint{color:var(--faint);}

/* ---------- app frame ---------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}
#main{padding:0 16px calc(104px + env(safe-area-inset-bottom));animation:fade .28s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- screen header ---------- */
.apphead{position:sticky;top:0;z-index:30;margin:0 -16px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(7,9,13,.86) 88%,transparent);}
.apphead-row{display:flex;align-items:flex-start;gap:12px;}
.apphead .htitle{flex:1;min-width:0;}
.htitle .eyebrow{font-size:13px;font-weight:600;color:var(--pri2);}
.htitle h1{font-size:26px;font-weight:800;line-height:1.05;display:flex;align-items:center;gap:8px;}
.htitle h1 .em{font-size:22px;}
.htitle p{font-size:13.5px;color:var(--mut);margin-top:4px;}
.head-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:2px;}

/* round icon button + bell */
.rbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card2);
  box-shadow:inset 0 0 0 1px var(--line);color:var(--text);position:relative;transition:.15s;}
.rbtn:active{transform:scale(.94);}
.rbtn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:20px;
  background:var(--pri);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);}
.gbtn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;font-weight:600;font-size:14px;
  padding:12px 16px;border-radius:14px;box-shadow:0 10px 24px -10px rgba(124,92,255,.7);transition:.12s;white-space:nowrap;}
.gbtn:active{transform:scale(.97);}
.gbtn.round{width:48px;height:48px;padding:0;border-radius:16px;justify-content:center;}
.gbtn svg{stroke-width:2.4;}

/* ---------- hero cards ---------- */
.hero{position:relative;border-radius:24px;padding:20px;overflow:hidden;color:#fff;margin-top:4px;
  background:radial-gradient(120% 120% at 88% -20%,rgba(255,255,255,.14),transparent 46%),
            radial-gradient(90% 130% at 6% 120%,rgba(168,85,247,.5),transparent 55%),
            linear-gradient(140deg,#5B3FC4 0%,#3D2E86 46%,#241E4E 100%);
  box-shadow:0 18px 40px -20px rgba(91,63,196,.8),inset 0 1px 0 rgba(255,255,255,.08);}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.75;background-image:
  radial-gradient(1.6px 1.6px at 62% 24%,rgba(255,255,255,.7),transparent),
  radial-gradient(1.4px 1.4px at 80% 16%,rgba(255,255,255,.5),transparent),
  radial-gradient(1.4px 1.4px at 90% 40%,rgba(255,255,255,.4),transparent),
  radial-gradient(1.2px 1.2px at 70% 60%,rgba(255,255,255,.35),transparent);}
.hero-illus{position:absolute;right:12px;top:50%;transform:translateY(-58%);width:118px;height:118px;opacity:.96;z-index:0;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4));}
.hero .cap{display:flex;align-items:center;gap:8px;position:relative;z-index:1;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600;}
.hero .eye{margin-left:2px;width:22px;height:22px;display:grid;place-items:center;opacity:.8;}
.hero .big{font-family:'Sora';font-weight:800;font-size:40px;letter-spacing:-2px;margin:8px 0 10px;position:relative;z-index:1;line-height:1;}
.hero .delta{position:relative;z-index:1;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  background:rgba(46,212,122,.22);color:#5CF0A0;padding:5px 10px;border-radius:20px;}
.hero .delta.down{background:rgba(251,84,104,.22);color:#FF8A98;}
.hero .delta + .dsub{position:relative;z-index:1;font-size:12.5px;color:rgba(255,255,255,.62);margin-left:8px;}
.hero-sub{position:relative;z-index:1;display:flex;align-items:stretch;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);}
.hero-sub .hs{flex:1;min-width:0;}
.hero-sub .hs .k{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600;}
.hero-sub .hs .v{font-family:'Sora';font-weight:700;font-size:15px;margin-top:4px;}
.hero-sub .hs.i .v{color:#5CF0A0;} .hero-sub .hs.e .v{color:#FF8A98;}
.hero-sub .circ{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;align-self:center;}
.hero-sub .divv{width:1px;background:rgba(255,255,255,.12);}
.hero-sub .spark{align-self:center;width:60px;flex-shrink:0;}

/* three-up mini row for savings hero */
.hero-tri{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);}
.hero-tri .ht{min-width:0;}
.hero-tri .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:7px;background:rgba(255,255,255,.12);}
.hero-tri .k{font-size:10.5px;color:rgba(255,255,255,.6);}
.hero-tri .v{font-family:'Sora';font-weight:700;font-size:15px;margin-top:1px;}
.hero-tri .s{font-size:10.5px;color:rgba(255,255,255,.55);}

/* ---------- section title ---------- */
.sec{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:22px 2px 12px;}
.sec h2{font-size:18px;font-weight:700;}
.sec p{font-size:12.5px;color:var(--mut);margin-top:2px;}
.sec .link{font-size:13px;font-weight:600;color:var(--pri2);display:inline-flex;align-items:center;gap:3px;}

/* ---------- cycle + add row ---------- */
.cyclerow{display:flex;gap:10px;margin:14px 0 4px;}
.cyclebtn{flex:1;display:flex;align-items:center;gap:10px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);
  border-radius:14px;padding:13px 14px;font-size:14px;font-weight:600;min-width:0;}
.cyclebtn .cal{color:var(--mut);flex-shrink:0;}
.cyclebtn .lbl{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cyclebtn .chev{color:var(--mut);flex-shrink:0;}

/* ---------- stat strip ---------- */
.strip{display:flex;align-items:stretch;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px;padding:16px 6px;margin-top:12px;}
.strip .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0;padding:0 4px;}
.strip .divv{width:1px;background:var(--line);margin:2px 0;}
.strip .sic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;}
.strip .sv{font-family:'Sora';font-weight:700;font-size:17px;letter-spacing:-.5px;}
.strip .sl{font-size:11px;color:var(--mut);font-weight:500;}

/* ---------- generic card ---------- */
.card2{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px;padding:16px;margin-bottom:12px;}
.summary{position:relative;overflow:hidden;border-radius:20px;padding:18px;margin-top:6px;
  background:radial-gradient(120% 130% at 100% 0%,rgba(124,92,255,.22),transparent 55%),var(--card2);box-shadow:inset 0 0 0 1px var(--line);}

/* ---------- segmented ---------- */
.seg{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.segbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mut);
  background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;transition:.14s;}
.segbtn svg{width:15px;height:15px;}
.segbtn.on{background:var(--pri-soft);color:#C7B8FF;box-shadow:inset 0 0 0 1px var(--pri-line);}
.segbtn.on.g{background:var(--in-soft);color:#7EE6AC;box-shadow:inset 0 0 0 1px var(--in-line);}

/* ---------- transaction row ---------- */
.txcard{display:flex;align-items:center;gap:13px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;}
.txcard::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--mut);}
.txcard.i::before{background:var(--in);} .txcard.e::before{background:var(--out);} .txcard.t::before{background:var(--pri);}
.circ{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;}
.circ svg{width:20px;height:20px;stroke-width:2.4;}
.txm{flex:1;min-width:0;}
.txm .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txm .rowchips{display:flex;align-items:center;gap:7px;margin:5px 0;flex-wrap:wrap;}
.txm .via{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);}
.txm .via svg{width:14px;height:14px;}
.txr{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.txr .dt{font-size:11.5px;color:var(--faint);}
.txr .ct{font-size:11.5px;color:var(--mut);}
.txr .amt{font-family:'JetBrains Mono';font-weight:700;font-size:15px;margin-top:2px;}
.kebab{position:absolute;top:10px;right:8px;width:28px;height:28px;display:grid;place-items:center;color:var(--faint);border-radius:8px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600;background:var(--raise);color:var(--mut);white-space:nowrap;}
.chip.in{background:var(--in-soft);color:#6FE3A6;} .chip.out{background:var(--out-soft);color:#FF8A98;}
.chip.pri{background:var(--pri-soft);color:#C7B8FF;} .chip.blue{background:var(--blue-soft);color:#8FB8FF;}
.chip.amber{background:var(--amber-soft);color:#F7CD7A;} .chip.cyan{background:rgba(34,211,238,.16);color:#7CE3F2;}
.dotcat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);}
.dotcat i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.endnote{text-align:center;color:var(--faint);font-size:12px;margin:16px 0 4px;display:flex;align-items:center;gap:10px;justify-content:center;}
.endnote::before,.endnote::after{content:"";height:1px;width:26px;background:var(--line);}

/* ---------- debt card ---------- */
.debtcard{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;}
.dc-top{display:flex;align-items:flex-start;gap:12px;}
.dc-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;}
.dc-ic svg{width:21px;height:21px;}
.dc-name{flex:1;min-width:0;}
.dc-name h3{font-size:15.5px;font-weight:700;}
.dc-name span{font-size:12.5px;color:var(--mut);}
.due-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:10px;white-space:nowrap;}
.due-chip svg{width:13px;height:13px;}
.dc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:15px;}
.dc-stats .l{font-size:11.5px;color:var(--mut);}
.dc-stats .v{font-weight:700;font-size:15px;margin-top:3px;font-family:'Sora';}
.dc-stats .v.sm{font-size:14px;}
.dc-stats .sub{font-size:11px;color:var(--faint);margin-top:2px;}
.dbar{height:7px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px;}
.dbar>i{display:block;height:100%;border-radius:20px;}
.dc-foot{display:flex;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--faint);}
.progline{display:flex;align-items:center;gap:8px;margin-top:14px;}
.progline .pl{font-size:13px;color:var(--mut);font-weight:600;}
.progline .track{flex:1;height:8px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden;}
.progline .track>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#FB5468,#A855F7);}
.progline .pv{font-weight:700;font-size:14px;font-family:'Sora';color:var(--out);}

/* tip / promo card */
.promo{display:flex;align-items:center;gap:13px;border-radius:18px;padding:15px;margin-top:6px;
  background:radial-gradient(120% 130% at 0% 0%,rgba(124,92,255,.16),transparent 60%),var(--card2);box-shadow:inset 0 0 0 1px var(--line);}
.promo .pic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pri-soft);color:#C7B8FF;flex-shrink:0;}
.promo .pt{flex:1;min-width:0;}
.promo .pt b{font-size:13.5px;color:#C7B8FF;font-weight:700;}
.promo .pt p{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.45;}
.promo .parrow{color:var(--pri2);flex-shrink:0;}
.promo.act{cursor:pointer;}
.promo .pbtn{flex-shrink:0;font-size:12.5px;font-weight:600;color:#C7B8FF;padding:9px 13px;border-radius:11px;box-shadow:inset 0 0 0 1px var(--pri-line);display:inline-flex;align-items:center;gap:5px;}

/* ---------- goal card ---------- */
.goalcard{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px;padding:16px;margin-bottom:12px;}
.gc-top{display:flex;align-items:flex-start;gap:12px;}
.gc-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;}
.gc-ic svg{width:21px;height:21px;}
.gc-name{flex:1;min-width:0;}
.gc-name h3{font-size:15.5px;font-weight:700;}
.gc-name span{font-size:12.5px;color:var(--mut);}
.status-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap;}
.status-chip i{width:7px;height:7px;border-radius:50%;}
.status-chip.ontrack{background:var(--in-soft);color:#6FE3A6;} .status-chip.ontrack i{background:var(--in);}
.status-chip.behind{background:var(--amber-soft);color:#F7CD7A;} .status-chip.behind i{background:var(--amber);}
.status-chip.done{background:var(--in-soft);color:#6FE3A6;}
.gc-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;}
.gc-amt{font-family:'Sora';font-weight:700;font-size:20px;}
.gc-amt small{display:block;font-size:11.5px;color:var(--faint);font-weight:500;font-family:'Inter';margin-top:2px;}
.gc-pct{text-align:right;}
.gc-pct b{font-family:'Sora';font-size:18px;}
.gc-pct small{display:block;font-size:11px;color:var(--faint);}
.gbar{height:8px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px;}
.gbar>i{display:block;height:100%;border-radius:20px;}
.gc-foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);font-size:12px;}
.gc-foot .gf .k{color:var(--faint);} .gc-foot .gf .v{font-weight:600;margin-top:2px;}
.gc-foot .right{text-align:right;}

/* overall progress hero (goals) */
.opgrid{position:relative;z-index:1;display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);}
.opgrid .opl{flex:1;}
.opgrid .opr{display:flex;flex-direction:column;gap:12px;}
.opgrid .opr .r{display:flex;align-items:center;gap:9px;}
.opgrid .opr .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex-shrink:0;}
.opgrid .opr .k{font-size:10.5px;color:rgba(255,255,255,.6);}
.opgrid .opr .v{font-family:'Sora';font-weight:700;font-size:14px;}

/* ---------- task card ---------- */
.grouphd{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;}
.grouphd .gl{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;}
.grouphd .cnt{min-width:22px;height:22px;padding:0 7px;border-radius:20px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);
  display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut);}
.grouphd.over .cnt{background:var(--out-soft);color:#FF8A98;box-shadow:none;}
.grouphd .cal{font-size:12.5px;font-weight:600;color:var(--pri2);display:inline-flex;align-items:center;gap:5px;}
.taskcard{display:flex;align-items:flex-start;gap:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:14px;margin-bottom:10px;
  border-left:3px solid var(--mut);}
.taskcard.p-High{border-left-color:var(--out);} .taskcard.p-Medium{border-left-color:var(--amber);} .taskcard.p-Low{border-left-color:var(--in);}
.taskcard.over{border-left-color:var(--out);box-shadow:inset 0 0 0 1px var(--out-line);}
.taskcard.done{opacity:.6;}
.tcheck{width:26px;height:26px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--hair);background:var(--card2);flex-shrink:0;display:grid;place-items:center;color:#04140d;margin-top:1px;transition:.15s;}
.tcheck.on{background:var(--in);box-shadow:0 0 12px -2px var(--in-line),inset 0 0 0 2px var(--in);}
.tcheck.over{box-shadow:inset 0 0 0 2px var(--out);}
.tcheck.over.on{background:var(--out);box-shadow:inset 0 0 0 2px var(--out);}
.tcheck svg{width:15px;height:15px;stroke-width:3;}
.tbody{flex:1;min-width:0;}
.tbody .tt{font-size:14.5px;font-weight:600;word-break:break-word;}
.tbody .tt.done{text-decoration:line-through;color:var(--mut);}
.tbody .tchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center;}
.tbody .tmeta{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12px;color:var(--faint);align-items:center;}
.tbody .tmeta .m{display:inline-flex;align-items:center;gap:5px;}
.tbody .tmeta svg{width:14px;height:14px;}

.tacts button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--faint);}
.tacts button:active{background:var(--raise);}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:40;display:flex;align-items:center;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(9,11,16,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;color:var(--faint);transition:.14s;}
.tab svg{width:22px;height:22px;stroke-width:2;}
.tab .tl{font-size:10px;font-weight:600;}
.tab.on{color:var(--pri2);}
.tab.on svg{stroke-width:2.3;}
.tab.on .ip{position:relative;}
.tab.on .ip::after{content:"";position:absolute;inset:-8px -12px;border-radius:12px;background:var(--pri-soft);z-index:-1;}

/* ---------- empty ---------- */
.empty{text-align:center;color:var(--faint);padding:40px 16px;}
.empty .eic{width:56px;height:56px;border-radius:18px;background:var(--card2);display:grid;place-items:center;margin:0 auto 14px;color:var(--mut);box-shadow:inset 0 0 0 1px var(--line);}
.empty b{display:block;color:var(--text);font-size:15px;font-weight:600;margin-bottom:5px;}
.empty p{font-size:13px;line-height:1.5;}

/* ---------- bottom sheet / modal ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,4,7,.6);backdrop-filter:blur(3px);animation:ov .2s ease;display:flex;flex-direction:column;justify-content:flex-end;}

.sheet{background:var(--bg2);border-radius:26px 26px 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.8);border-top:1px solid var(--hair);
  max-height:92vh;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.25,1);max-width:520px;margin:0 auto;width:100%;}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-grip{width:40px;height:4px;border-radius:20px;background:var(--hair);margin:10px auto 4px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 14px;border-bottom:1px solid var(--line);}
.sheet-head h3{font-size:18px;font-weight:700;}
.sheet-head .x{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--mut);}
.sheet-body{padding:18px 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;}
.field{margin-bottom:15px;min-width:0;}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:8px;}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;
  padding:14px;font-size:16px;color:var(--text);transition:.15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;box-shadow:inset 0 0 0 1px var(--pri-line);}
.field input::placeholder,.field textarea::placeholder{color:var(--faint);}
.field select option{background:#141824;}
.field textarea{min-height:74px;resize:vertical;}
.field input[type=date],.field input[type=datetime-local]{min-width:0;}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
.two>*{min-width:0;}
.seg-pick{display:flex;gap:8px;flex-wrap:wrap;}
.seg-pick button{flex:1;min-width:84px;padding:11px;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--mut);}
.seg-pick button.on{background:var(--pri-soft);color:#C7B8FF;box-shadow:inset 0 0 0 1px var(--pri-line);}
.icon-pick{display:flex;gap:9px;flex-wrap:wrap;}
.icon-pick button{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);color:var(--mut);}
.icon-pick button.on{background:var(--pri-soft);color:#C7B8FF;box-shadow:inset 0 0 0 1px var(--pri-line);}
.sheet-foot{display:flex;gap:12px;margin-top:8px;}
.sheet-foot .gbtn{flex:1;justify-content:center;padding:15px;font-size:15px;}
.sheet-foot .ghost{flex:0 0 auto;padding:15px 20px;border-radius:14px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);color:var(--text);font-weight:600;}

/* action sheet (kebab menu) */
.actsheet{background:var(--bg2);border-radius:22px;margin:0 auto 12px;max-width:490px;width:calc(100% - 24px);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--hair);animation:up .26s cubic-bezier(.2,.8,.25,1);}
.actsheet button{width:100%;display:flex;align-items:center;gap:13px;padding:16px 18px;font-size:15px;font-weight:500;color:var(--text);border-bottom:1px solid var(--line2);}
.actsheet button:last-child{border-bottom:0;}
.actsheet button svg{width:19px;height:19px;color:var(--mut);}
.actsheet button.danger{color:var(--out);} .actsheet button.danger svg{color:var(--out);}
.actsheet-cancel{background:var(--card2);border-radius:18px;margin:0 auto calc(14px + env(safe-area-inset-bottom));max-width:490px;width:calc(100% - 24px);

.overlay.center{justify-content:flex-end;}

/* settings rows */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line2);}

.setrow .sinfo p{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.4;}
.toggle{width:50px;height:28px;border-radius:20px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--hair);position:relative;flex-shrink:0;transition:.18s;}
.toggle::after{content:"";position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.18s;}
.toggle.on{background:var(--pri-soft);box-shadow:inset 0 0 0 1px var(--pri-line);}
.toggle.on::after{left:25px;background:var(--pri2);}
.pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;}
.pill.ok{background:var(--in-soft);color:#6FE3A6;} .pill.no{background:var(--out-soft);color:#FF8A98;}
.about{font-size:13px;color:var(--mut);line-height:1.6;} .about b{color:var(--text);}

.btnrow button.danger{color:var(--out);box-shadow:inset 0 0 0 1px var(--out-line);}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;

.bcard{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:20px;padding:16px;margin-bottom:4px;}

.minirow{display:flex;align-items:center;gap:11px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:15px;padding:12px 13px;margin-bottom:9px;}

  else if(kind==="debtpay"){ var dd=findItem("debt",editId); var rec=isReceivable(dd); title=rec?"Record received":"Record payment";
    h='<p class="about" style="margin-bottom:14px">'+esc(dd.name)+' · '+(rec?"outstanding":"remaining")+' <b>'+rs(debtRemaining(dd))+'</b></p>'+
      '<label class="field"><span>'+(rec?"Amount received (Rs)":"Payment amount (Rs)")+'</span><input type="number" inputmode="numeric" id="f_payamt" value="'+(Number(dd.minPayment)>0?dd.minPayment:debtRemaining(dd))+'"></label>'; }
  else if(kind==="saving"){ title=e?"Edit entry":"Add saving / investment";
    h='<div class="two"><label class="field"><span>Platform</span>'+sel("f_splat",SAVE_PLATFORMS,e?e.platform:"Bank Savings")+'</label>'+
      '<label class="field"><span>Type</span>'+sel("f_skind",SAVE_TYPES,e?e.kind:"Deposit")+'</label></div>'+
      '<div class="two"><label class="field"><span>Amount (Rs)</span><input type="number" inputmode="numeric" id="f_samount" value="'+(e?e.amount:"")+'"></label>'+
      '<label class="field"><span>Date</span><input type="date" id="f_sdate" value="'+(e?e.date:t)+'"></label></div>'+
      '<label class="field"><span>Note (optional)</span><input id="f_snote" placeholder="e.g. purpose or details" value="'+(e?esc(e.note):"")+'"></label>'; }
  else if(kind==="goal"){ title=e?"Edit goal":"New goal"; var ic=e?e.icon:"target";
    h='<label class="field"><span>Goal name</span><input id="f_gname" placeholder="e.g. Europe Trip" value="'+(e?esc(e.name):"")+'"></label>'+
      '<label class="field"><span>Short note</span><input id="f_gsub" placeholder="e.g. Dream vacation" value="'+(e?esc(e.subtitle):"")+'"></label>'+
      '<label class="field"><span>Icon</span><div class="icon-pick" id="f_icon" data-icon="'+ic+'">'+GOAL_ICONS.map(function(i){return '<button type="button" data-pickicon="'+i+'" class="'+(i===ic?"on":"")+'">'+svg(i,20)+'</button>';}).join("")+'</div></label>'+
      '<div class="two"><label class="field"><span>Saved so far</span><input type="number" inputmode="numeric" id="f_gsaved" value="'+(e?e.saved:0)+'"></label>'+
      '<label class="field"><span>Target amount</span><input type="number" inputmode="numeric" id="f_gtarget" value="'+(e?e.target:"")+'"></label></div>'+
      '<label class="field"><span>Target date</span><input type="date" id="f_gdate" value="'+(e?e.targetDate:toISO(addMonths(new Date(),6)))+'"></label>'; }
  else if(kind==="task"){ title=e?"Edit task":"New task";
    h='<label class="field"><span>Title</span><input id="f_title" placeholder="What needs doing?" value="'+(e?esc(e.title):"")+'"></label>'+
      '<label class="field"><span>Details (optional)</span><textarea id="f_desc" placeholder="Notes…">'+(e?esc(e.desc):"")+'</textarea></label>'+
      '<div class="two"><label class="field"><span>Category</span>'+sel("f_tcat",TASK_CATS,e?e.cat:"Work")+'</label>'+
      '<label class="field"><span>Priority</span>'+sel("f_tpri",PRIOS,e?e.pri:"Medium")+'</label></div>'+
      '<label class="field"><span>Due date & time</span><input type="datetime-local" id="f_tdue" value="'+nowLocalInput(e?e.due:null)+'"></label>'+
      '<div class="two"><label class="field"><span>Email reminder</span>'+selPairs("f_remind",REMINDS,e?e.remind:60)+'</label>'+
      '<label class="field"><span>Repeat</span>'+sel("f_repeat",REPEATS,e?e.repeat:"none")+'</label></div>'+
      '<label class="field" id="f_remindat_wrap" style="'+(Number(e?e.remind:60)===-2?"":"display:none")+'"><span>Custom reminder date & time</span><input type="datetime-local" id="f_remindat" value="'+nowLocalInput(e&&e.remindAt?e.remindAt:(e&&e.due?e.due:null))+'"></label>'; }
  else if(kind==="cycle"){ title="Set custom cycle"; var cc=state.customCycle||{};
    h='<p class="about" style="margin-bottom:14px">Pick any start and end date to view a custom range instead of the 15th-to-14th cycle.</p>'+
      '<div class="two"><label class="field"><span>Start</span><input type="date" id="f_cstart" value="'+(cc.start||t)+'"></label>'+
      '<label class="field"><span>End</span><input type="date" id="f_cend" value="'+(cc.end||t)+'"></label></div>'; }
  sheetOpen('<div class="overlay"><div class="sheet"><div class="sheet-grip"></div>'+
    '<div class="sheet-head"><h3>'+title+'</h3><button class="x" data-close>'+svg("x",18)+'</button></div>'+
    '<div class="sheet-body">'+h+'<div class="sheet-foot">'+(editId&&kind!=="debtpay"?'<button class="ghost" data-close>Cancel</button>':"")+'<button class="gbtn" data-save="'+kind+'">'+svg("check",18)+' Save</button></div></div></div></div>'); }

function findItem(kind,id){ var list=kind==="entry"?state.transactions:kind==="debt"||kind==="debtpay"?state.debts:kind==="goal"?state.goals:kind==="saving"?state.savings:state.tasks; for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i]; return null; }
function val(id){ var el=document.getElementById(id); return el?el.value:""; }
function num(id){ return Number(val(id))||0; }

function saveSheet(kind){
  if(kind==="entry"){ var ty=val("f_type"); var it=val("f_item").trim(); if(!it){toast("Add an item name");return;} var amt=num("f_amount"); if(amt<=0){toast("Enter an amount");return;}
    var cat=val("f_cat"); if(ty==="Transfer")cat="Transfer";
    var obj={date:val("f_date"),type:ty,category:cat,item:it,amount:amt,via:val("f_via"),note:val("f_note").trim()};
    if(window._edit){ var x=findItem("entry",window._edit); Object.assign(x,obj); } else { obj.id=uid(); state.transactions.push(obj); }
  }
  else if(kind==="debt"){ var nm=val("f_name").trim(); if(!nm){toast("Add a name");return;} var tot=num("f_total"); if(tot<=0){toast("Enter total amount");return;}
    var dirEl=document.getElementById("f_dir"); var dir=(dirEl?dirEl.getAttribute("data-dir"):"owe")||"owe";
    var obj={name:nm,lender:val("f_lender").trim(),kind:val("f_kind"),direction:dir,total:tot,paid:Math.min(num("f_paid"),tot),minPayment:num("f_min"),dueDate:val("f_due"),note:""};
    if(window._edit){ var d=findItem("debt",window._edit); Object.assign(d,obj); } else { obj.id=uid(); state.debts.push(obj); } }
  else if(kind==="debtpay"){ var d2=findItem("debt",window._edit); var p=num("f_payamt"); if(p<=0){toast("Enter an amount");return;} d2.paid=Math.min(Number(d2.total),Number(d2.paid||0)+p); var rec2=isReceivable(d2); toast(debtPaidOff(d2)?(rec2?"Fully received 🎉":"Debt cleared 🎉"):(rec2?"Received recorded":"Payment recorded")); }
  else if(kind==="saving"){ var samt=num("f_samount"); if(samt<=0){toast("Enter an amount");return;}
    var obj={platform:val("f_splat"),kind:val("f_skind"),amount:samt,date:val("f_sdate"),note:val("f_snote").trim()};
    if(window._edit){ var sx=findItem("saving",window._edit); Object.assign(sx,obj); } else { obj.id=uid(); state.savings.push(obj); } toast(obj.kind==="Withdraw"?"Withdrawal logged":"Saving logged"); }
  else if(kind==="goal"){ var gn=val("f_gname").trim(); if(!gn){toast("Add a goal name");return;} var tg=num("f_gtarget"); if(tg<=0){toast("Enter a target");return;}
    var ic=document.getElementById("f_icon").getAttribute("data-icon")||"target";
    var obj={name:gn,subtitle:val("f_gsub").trim(),icon:ic,saved:num("f_gsaved"),target:tg,targetDate:val("f_gdate")};
    if(window._edit){ var g=findItem("goal",window._edit); Object.assign(g,obj); if(goalDone(g)&&!g.completedDate)g.completedDate=todayISO(); if(!goalDone(g))g.completedDate=null; }
    else { obj.id=uid(); obj.createdAt=Date.now(); if(obj.saved>=obj.target&&obj.target>0)obj.completedDate=todayISO(); state.goals.push(obj); } }
  else if(kind==="task"){ var ti=val("f_title").trim(); if(!ti){toast("Add a title");return;}
    var due=val("f_tdue"); var dueISO=due?new Date(due).toISOString():null;
    var rem=Number(val("f_remind"));
    var remindAt=(rem===-2&&val("f_remindat"))?new Date(val("f_remindat")).toISOString():null;
    if(rem===-2&&!remindAt){toast("Pick a custom reminder time");return;}
    var obj={title:ti,desc:val("f_desc").trim(),cat:val("f_tcat"),pri:val("f_tpri"),due:dueISO,remind:rem,remindAt:remindAt,repeat:val("f_repeat"),status:"todo"};
    if(window._edit){ var k=findItem("task",window._edit); var st=k.status; Object.assign(k,obj); k.status=st; } else { obj.id=uid(); obj.created=Date.now(); state.tasks.push(obj); } }
  else if(kind==="cycle"){ var cs=val("f_cstart"),ce=val("f_cend"); if(cs>ce){toast("End must be after start");return;} state.customCycle={start:cs,end:ce,label:"Custom"}; state.selectedCycle="custom"; }
  save(); closeSheet(); render();
}

/* cycle picker sheet */
function openCycleSheet(){
  var opts=[]; var cur=cycleStartOf(todayISO()); opts.push(cur);
  state.transactions.forEach(function(x){var c=cycleStartOf(x.date); if(opts.indexOf(c)<0)opts.push(c);});
  opts.sort(); opts.reverse();
  var rows="";
  if(state.customCycle){ rows+='<button data-cyclepick="custom">'+svg("cal",18)+cycleLabel("custom")+(state.selectedCycle==="custom"?'<span style="margin-left:auto;color:var(--pri2)">'+svg("check",16)+'</span>':"")+'</button>'; }
  rows+=opts.map(function(o){return '<button data-cyclepick="'+o+'">'+svg("cal",18)+cycleLabel(o)+(o===state.selectedCycle?'<span style="margin-left:auto;color:var(--pri2)">'+svg("check",16)+'</span>':"")+'</button>';}).join("");
  sheetOpen('<div class="overlay"><div class="sheet"><div class="sheet-grip"></div>'+
    '<div class="sheet-head"><h3>Choose cycle</h3><button class="x" data-close>'+svg("x",18)+'</button></div>'+
    '<div class="sheet-body" style="padding-top:8px"><div class="actsheet" style="margin:0;width:100%">'+rows+
    '<button data-cyclepick="__custom">'+svg("plus",18)+'Set custom range…</button></div></div></div></div>'); }

/* kebab action sheet */
function openKebab(kind,id){
  var rows="";
  if(kind==="tx")rows='<button data-editentry="'+id+'">'+svg("edit",18)+'Edit entry</button><button class="danger" data-del="transactions:'+id+'">'+svg("trash",18)+'Delete</button>';
  else if(kind==="debt"){ var d=findItem("debt",id); var rec=isReceivable(d); rows=(debtPaidOff(d)?"":'<button data-paydebt="'+id+'">'+svg("check",18)+(rec?"Record received":"Record payment")+'</button>')+'<button data-editdebt="'+id+'">'+svg("edit",18)+'Edit</button><button class="danger" data-del="debts:'+id+'">'+svg("trash",18)+'Delete</button>'; }
  else if(kind==="goal")rows='<button data-editgoal="'+id+'">'+svg("edit",18)+'Edit goal</button><button class="danger" data-del="goals:'+id+'">'+svg("trash",18)+'Delete</button>';
  else if(kind==="saving")rows='<button data-editsaving="'+id+'">'+svg("edit",18)+'Edit entry</button><button class="danger" data-del="savings:'+id+'">'+svg("trash",18)+'Delete</button>';
  else if(kind==="task"){ var k=findItem("task",id); rows='<button data-tdone="'+id+'">'+svg("check",18)+(isDone(k)?"Mark as not done":"Mark done")+'</button><button data-edittask="'+id+'">'+svg("edit",18)+'Edit task</button><button class="danger" data-del="tasks:'+id+'">'+svg("trash",18)+'Delete</button>'; }
  sheetOpen('<div class="overlay center"><div class="actsheet">'+rows+'</div><button class="actsheet-cancel" data-close>Cancel</button></div>'); }

/* fab chooser + more menu + tx filter */
function openFab(){ sheetOpen('<div class="overlay center"><div class="actsheet">'+
  '<button data-add="entry">'+svg("plus",18)+'Add transaction</button>'+
  '<button data-add="task">'+svg("task",18)+'New task</button>'+
  '<button data-add="debt">'+svg("debt",18)+'Add debt / due</button>'+
  '<button data-add="saving">'+svg("save",18)+'Add saving</button>'+
  '<button data-add="goal">'+svg("goal",18)+'New goal</button></div><button class="actsheet-cancel" data-close>Cancel</button></div>'); }
function openMore(){ sheetOpen('<div class="overlay center"><div class="actsheet">'+
  '<button data-goto="save">'+svg("save",18)+'Savings</button>'+
  '<button data-goto="goal">'+svg("goal",18)+'Goals</button>'+
  '<button data-goto="settings">'+svg("gear",18)+'Settings</button></div><button class="actsheet-cancel" data-close>Cancel</button></div>'); }
function openTxFilter(){ var cats=["(All categories)"].concat(INCOME_CATS,EXPENSE_CATS,["Transfer"]);
  sheetOpen('<div class="overlay"><div class="sheet"><div class="sheet-grip"></div>'+
    '<div class="sheet-head"><h3>Filter</h3><button class="x" data-close>'+svg("x",18)+'</button></div>'+
    '<div class="sheet-body"><label class="field"><span>Category</span>'+sel("f_txcat",cats,state.ui.txCat||"(All categories)")+'</label>'+
    '<div class="sheet-foot"><button class="ghost" data-txclear>Clear</button><button class="gbtn" data-txapply>'+svg("check",18)+' Apply</button></div></div></div></div>'); }

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener("click",function(ev){
  var t=ev.target, el;
  if(t.classList&&t.classList.contains("overlay")){ closeSheet(); return; }
  if(t.closest("[data-close]")){ closeSheet(); return; }
  if(el=t.closest("[data-tab]")){ setTab(el.getAttribute("data-tab")); return; }
  if(t.closest("[data-more]")){ openMore(); return; }
  if(el=t.closest("[data-goto]")){ closeSheet(); setTab(el.getAttribute("data-goto")); return; }
  if(t.closest("[data-fab]")){ openFab(); return; }
  if(el=t.closest("[data-add]")){ closeSheet(); openSheet(el.getAttribute("data-add")); return; }
  if(el=t.closest("[data-seg]")){ var p=el.getAttribute("data-seg").split(":"); state.ui[p[0]+"Seg"]=p[1]; save(); render(); return; }
  if(t.closest("[data-cycle]")){ openCycleSheet(); return; }
  if(el=t.closest("[data-cyclepick]")){ var v=el.getAttribute("data-cyclepick"); if(v==="__custom"){ openSheet("cycle"); return; } state.selectedCycle=v; state.customCycle=(v==="custom"?state.customCycle:null); save(); closeSheet(); render(); return; }
  if(t.closest("[data-eye]")){ state.hideBalance=!state.hideBalance; save(); render(); return; }
  if(el=t.closest("[data-kebab]")){ var k=el.getAttribute("data-kebab").split(":"); openKebab(k[0],k[1]); return; }
  if(el=t.closest("[data-tdone]")){ toggleTask(el.getAttribute("data-tdone")); return; }
  if(el=t.closest("[data-paydebt]")){ openSheet("debtpay",el.getAttribute("data-paydebt")); return; }
  if(el=t.closest("[data-editentry]")){ openSheet("entry",el.getAttribute("data-editentry")); return; }
  if(el=t.closest("[data-editdebt]")){ openSheet("debt",el.getAttribute("data-editdebt")); return; }
  if(el=t.closest("[data-editgoal]")){ openSheet("goal",el.getAttribute("data-editgoal")); return; }
  if(el=t.closest("[data-edittask]")){ openSheet("task",el.getAttribute("data-edittask")); return; }
  if(el=t.closest("[data-editsaving]")){ openSheet("saving",el.getAttribute("data-editsaving")); return; }
  if(el=t.closest("[data-pickdir]")){ var pd=el.getAttribute("data-pickdir"); var dbox=document.getElementById("f_dir"); if(dbox){ dbox.setAttribute("data-dir",pd); dbox.querySelectorAll("button").forEach(function(b){b.classList.remove("on");}); el.classList.add("on"); } var ks=document.getElementById("f_kind"); if(ks){ var kinds=pd==="receive"?RECEIVE_KINDS:DEBT_KINDS; ks.innerHTML=kinds.map(function(x){return '<option>'+esc(x)+'</option>';}).join(""); } return; }
  if(el=t.closest("[data-pickicon]")){ var box=document.getElementById("f_icon"); box.setAttribute("data-icon",el.getAttribute("data-pickicon")); box.querySelectorAll("button").forEach(function(b){b.classList.remove("on");}); el.classList.add("on"); return; }
  if(el=t.closest("[data-save]")){ saveSheet(el.getAttribute("data-save")); return; }
  if(el=t.closest("[data-del]")){ var d=el.getAttribute("data-del").split(":"); if(confirm("Delete this permanently?")){ state[d[0]]=state[d[0]].filter(function(x){return x.id!==d[1];}); save(); closeSheet(); render(); } return; }
  if(t.closest("[data-txfilter]")){ openTxFilter(); return; }
  if(t.closest("[data-txapply]")){ var c=val("f_txcat"); state.ui.txCat=(c==="(All categories)"?"":c); save(); closeSheet(); render(); return; }
  if(t.closest("[data-txclear]")){ state.ui.txCat=""; save(); closeSheet(); render(); return; }
  if(t.closest("[data-notif]")){ toggleNotif(); return; }
  if(t.closest("[data-testnotif]")){ testNotif(); return; }
  if(t.closest("[data-savemail]")){ state.email={to:val("s_to").trim(),service:val("s_service").trim(),template:val("s_template").trim(),key:val("s_key").trim()}; save(); render(); toast("Email settings saved"); return; }
  if(t.closest("[data-savebudget]")){ var b={}; document.querySelectorAll(".budinput").forEach(function(i){ b[i.getAttribute("data-budcat")]=Number(i.value)||0; }); state.budgets=Object.assign({},state.budgets,b); save(); render(); toast("Budgets saved"); return; }
  if(t.closest("[data-testmail]")){ testEmail(); return; }
  if(t.closest("[data-export]")){ exportData(); return; }
  if(t.closest("[data-import]")){ importData(); return; }
  if(t.closest("[data-reset]")){ if(confirm("Reset to sample data? This clears your entries.")){ state=makeSeed(); save(); render(); toast("Reset to sample data"); } return; }
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.id==="f_type"){ var box=el.closest(".sheet-body"); var catSel=box.querySelector("#f_cat"); var ty=el.value; var cats=ty==="Income"?INCOME_CATS:ty==="Transfer"?["Transfer"]:EXPENSE_CATS; if(catSel)catSel.innerHTML=cats.map(function(x){return '<option>'+esc(x)+'</option>';}).join(""); }
  if(el.id==="f_remind"){ var wrap=document.getElementById("f_remindat_wrap"); if(wrap)wrap.style.display=(el.value==="-2"?"":"none"); }
});
document.addEventListener("input",function(ev){
  var el=ev.target; if(el.classList&&el.classList.contains("budinput")){ var tot=0; document.querySelectorAll(".budinput").forEach(function(i){tot+=Number(i.value)||0;}); var b=document.getElementById("budtotal"); if(b)b.textContent=rs(tot); }
});

function toggleTask(id){ var k=findItem("task",id); if(!k)return; if(k.status==="done"){ k.status="todo"; } else { k.status="done"; if(k.repeat&&k.repeat!=="none"&&k.due)spawnNext(k); } save(); closeSheet(); render(); }
function spawnNext(k){ var d=new Date(k.due); var old=new Date(k.due).getTime(); if(k.repeat==="daily")d.setDate(d.getDate()+1); else if(k.repeat==="weekly")d.setDate(d.getDate()+7); else if(k.repeat==="monthly")d.setMonth(d.getMonth()+1); var delta=d.getTime()-old; var nAt=(Number(k.remind)===-2&&k.remindAt)?new Date(new Date(k.remindAt).getTime()+delta).toISOString():null; state.tasks.push({id:uid(),title:k.title,desc:k.desc,cat:k.cat,pri:k.pri,due:d.toISOString(),remind:k.remind,remindAt:nAt,repeat:k.repeat,status:"todo",created:Date.now()}); }

/* =====================================================================
   REMINDERS + EMAIL
   ===================================================================== */
function toggleNotif(){ if(!("Notification" in window)){ toast("Notifications not supported here"); return; }
  if(!state.notif){ Notification.requestPermission().then(function(p){ state.notif=(p==="granted"); save(); render(); if(p!=="granted")toast("Allow notifications in your browser"); }); }
  else { state.notif=false; save(); render(); } }
function testNotif(){ if(state.notif&&"Notification" in window&&Notification.permission==="granted"){ new Notification("MK Tracker",{body:"Reminders are working ✅"}); } else { toast("Turn on browser notifications first"); } }
function sendEmail(params){ var e=state.email||{}; return fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:e.service,template_id:e.template,user_id:e.key,template_params:params})}); }
function testEmail(){ var e=state.email||{}; if(!(e.service&&e.template&&e.key&&e.to)){ toast("Fill in all EmailJS fields first"); return; }
  sendEmail({task_title:"Test reminder",due_text:"just now",message:"Your MK Tracker email reminders are working.",to_email:e.to})
    .then(function(r){ toast(r.ok?"Test email sent — check inbox":"Email failed — check IDs"); })
    .catch(function(){ toast("Email failed — check IDs / network"); }); }
function checkReminders(){ var e=state.email||{}, mailOk=e.service&&e.template&&e.key&&e.to, now=Date.now(); var changed=false;
  state.tasks.forEach(function(k){ if(k.status==="done")return; var rem=Number(k.remind); if(rem===-1)return;
    var fire,winEnd,key;
    if(rem===-2){ if(!k.remindAt)return; fire=new Date(k.remindAt).getTime(); winEnd=fire+3600000; key=k.id+"|"+k.remindAt; }
    else { if(!k.due)return; var due=new Date(k.due).getTime(); fire=due-rem*60000; winEnd=due+3600000; key=k.id+"|"+k.due; }
    if(now>=fire&&now<=winEnd&&!state.notified[key]){
      state.notified[key]=true; changed=true;
      var body=(rem===-2?"Custom reminder"+(k.due?" · due "+dueTimeText(k):""):dueTimeText(k));
      if(state.notif&&"Notification" in window&&Notification.permission==="granted"){ try{ new Notification("Reminder: "+k.title,{body:body}); }catch(err){} }
      if(mailOk){ sendEmail({task_title:k.title,due_text:(k.due?dueTimeText(k):"custom time"),message:k.desc||"This task reminder is due now.",to_email:e.to}).catch(function(){}); }
    } });
  if(changed)save(); }

/* export / import */
function exportData(){ try{ var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download="mk-tracker-backup.json"; a.click(); setTimeout(function(){URL.revokeObjectURL(url);},1000); toast("Backup downloaded"); }catch(e){ toast("Export failed"); } }
function importData(){ var inp=document.createElement("input"); inp.type="file"; inp.accept="application/json"; inp.onchange=function(){ var f=inp.files[0]; if(!f)return; var r=new FileReader(); r.onload=function(){ try{ state=normalize(JSON.parse(r.result)); save(); render(); toast("Data imported"); }catch(e){ toast("Invalid file"); } }; r.readAsText(f); }; inp.click(); }

/* init */
render();
checkReminders();
setInterval(checkReminders,60000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden)checkReminders(); });

</script>
</body></html>
